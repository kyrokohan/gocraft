name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Never download a different Go than the one go.mod asks for.
env:
  GOTOOLCHAIN: local

# A newer push to the same branch or pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tidy modules, formatting, vet and the tests, on Linux and macOS. The race detector
  # runs on Linux only: it makes the tests take many times as long, and a race in this
  # program does not depend on the system it runs on.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: -race
          - os: macos-latest
            race: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - run: make check RACE=${{ matrix.race }}
